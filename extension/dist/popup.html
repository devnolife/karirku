<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 system-ui, sans-serif;
        color: #111827;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      .muted { color: #6b7280; font-size: 12px; }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font: 600 13px system-ui, sans-serif;
        cursor: pointer;
      }
      button.secondary { background: #f3f4f6; color: #111827; }
      #status { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #f9fafb; }
      label.row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px 8px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        font: 12px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Karirku Auto-Fill</h1>
    <div class="muted">AI mengisi, Anda review &amp; submit sendiri.</div>

    <div id="status">Memuat status…</div>

    <label class="row">
      <input type="checkbox" id="enabled" />
      <span>Aktifkan di semua halaman</span>
    </label>

    <div style="margin-top: 12px">
      <span class="muted">Server karirku</span>
      <input type="text" id="apiBase" placeholder="http://localhost:3030" />
    </div>

    <button id="connect">Hubungkan ke Karirku</button>
    <button id="disconnect" class="secondary" hidden>Putuskan koneksi</button>

    <script src="popup.js"></script>
  </body>
</html>
