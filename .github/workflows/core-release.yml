name: Release core

# Publishes @devnolife/karirku-core (packages/core) to GitHub Packages.
# The web app consumes it through the workspace link, so a release is only
# needed for outside consumers.
on:
  push:
    tags: ["core-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@devnolife"

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm core:lint
      - run: pnpm core:typecheck
      - run: pnpm core:test
      - run: pnpm core:build

      # The tag must match the version in package.json, otherwise a mistagged
      # release would silently publish the wrong version.
      - name: Verify tag matches package version
        working-directory: packages/core
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#core-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag $TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # core:build already ran; skip prepack so we publish exactly what we tested.
      - run: pnpm publish --no-git-checks --ignore-scripts
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
