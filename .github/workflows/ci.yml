name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates into packages/core/generated/prisma; needs no database.
      - run: pnpm db:generate

      # Engine first: the app imports its dist/ and type declarations.
      - run: pnpm core:lint
      - run: pnpm core:typecheck
      - run: pnpm core:test
      - run: pnpm core:build

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec next build
